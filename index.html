<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Career Compass — radar tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a10;--pan:#0b1019;--ink:#eaf2f8;--dim:#8a97a8;--faint:#59647a;--line:#1b2434;--games:#3b6fe0;--film:#ff9b3d;--violet:#8a63ff;--sel:#36d98a;--ink2:#c7d2dd;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 60% 30%,#0c1422,#05070d 70%);color:var(--ink);
  font-family:"JetBrains Mono",ui-monospace,monospace;overflow:hidden;}
.app{display:grid;grid-template-columns:252px 1fr;height:100vh;height:100dvh;}

/* menu */
.menu{border-right:1px solid var(--line);background:rgba(8,12,20,.6);overflow-y:auto;padding:16px 0 30px;backdrop-filter:blur(4px);}
.menu .ttl{padding:4px 18px 14px;font-family:"Orbitron";font-size:13px;font-weight:700;letter-spacing:.1em;}
.menu .grp{padding:14px 18px 6px;font-family:"Orbitron";font-size:10px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px;}
.menu .grp .gdot{width:7px;height:7px;border-radius:50%;}
.menu .grp.g .gdot{background:var(--games);box-shadow:0 0 8px var(--games);}
.menu .grp.v .gdot{background:var(--film);box-shadow:0 0 8px var(--film);}
.menu .grp .cnt{margin-left:auto;color:var(--faint);font-family:"JetBrains Mono";letter-spacing:0;font-weight:400;}
.r{display:flex;align-items:center;gap:10px;padding:7px 18px;cursor:pointer;border-left:2px solid transparent;font-size:12px;color:var(--dim);transition:.14s;}
.r:hover{background:rgba(255,255,255,.03);color:var(--ink);}
.r .rd{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none;transition:.14s;}
.r.on{border-left-color:var(--sel);color:var(--ink);}
.r.g.on .rd{background:var(--games);box-shadow:0 0 7px var(--games);}
.r.v.on .rd{background:var(--film);box-shadow:0 0 7px var(--film);}

/* stage */
.stage{position:relative;overflow:hidden;touch-action:none;cursor:grab;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.stage.drag{cursor:grabbing;}
.scene{position:absolute;inset:0;perspective:2400px;perspective-origin:50% 42%;z-index:2;}
.torus{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible;}
.world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform;}

.unit{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;
  transition:transform .65s cubic-bezier(.22,1,.36,1),filter .5s ease;}
.disk{position:absolute;left:0;top:0;width:480px;height:480px;margin:-240px 0 0 -240px;
  transform-style:preserve-3d;backface-visibility:visible;
  transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .5s ease;}
.disk svg{display:block;width:480px;height:480px;overflow:visible;}
.lyr{position:absolute;inset:0;backface-visibility:visible;}
.lyr.cap svg{pointer-events:none;}
.disk:not(.flat) .lyr,.disk:not(.flat) .wall{opacity:.4;filter:brightness(.8);}
.unit.preview .disk .lyr,.unit.preview .disk .wall{opacity:1;filter:none;}
.walls{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none;}
.wall{position:absolute;left:50%;top:50%;backface-visibility:hidden;}
.disk.flat .walls,.disk.flat .lyr.cap{display:none;}
.disk.snap{transition:none !important;}
.ring{fill:none;stroke:rgba(255,255,255,.10);stroke-width:.6;}
.spoke{stroke:rgba(255,255,255,.08);stroke-width:.6;}
.poly{stroke-width:1.2;}
.lab{font-family:"JetBrains Mono";font-size:9.7px;font-weight:500;fill:var(--ink2);opacity:0;transition:opacity .4s;text-anchor:middle;}
.cap{font-family:"Orbitron";font-size:11px;font-weight:700;letter-spacing:.06em;opacity:0;transition:opacity .4s;text-anchor:middle;}
.stag{font-family:"Orbitron";font-size:10.5px;font-weight:700;letter-spacing:.2em;opacity:0;transition:opacity .4s;text-anchor:middle;text-transform:uppercase;}
.unit.focus .lab,.unit.focus .cap,.unit.focus .stag{opacity:1;}
.unit.focus .poly{filter:drop-shadow(0 0 5px var(--glow));}
.unit.preview .poly{filter:drop-shadow(0 0 12px var(--sel)) drop-shadow(0 0 4px var(--sel));stroke:var(--sel);stroke-width:2.4;stroke-opacity:.95;}
.stage:not(.drag) .unit:hover .poly{filter:drop-shadow(0 0 9px var(--sel));stroke:var(--sel);stroke-width:1.8;}
.pt{cursor:pointer;}
.disk.dim{opacity:.16;filter:blur(3px);}
.callout{position:absolute;z-index:8;pointer-events:none;transform:translateX(-50%);
  font:600 12px/1.2 "JetBrains Mono";letter-spacing:.04em;color:var(--ink);white-space:nowrap;
  text-shadow:0 1px 6px #000;opacity:0;transition:opacity .18s;}
.callout .ctxt{display:block;padding-bottom:3px;border-bottom:1px solid var(--sel);}
.callout .lead{position:absolute;left:50%;top:100%;height:0;border-top:1px solid var(--sel);
  transform-origin:left center;opacity:.7;}
.callout.show{opacity:1;}

/* vertex-focus card */
.fcard{position:absolute;top:50%;right:40px;transform:translateY(-50%);z-index:8;pointer-events:none;width:300px;padding:12px 0;
  background:none;opacity:0;transition:opacity .3s;--acc:var(--sel);}
.fcard.show{opacity:1;pointer-events:auto;}
.fcard.left{left:40px;right:auto;}
.fcard .ft{font:700 10px/1 "Orbitron";letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin-bottom:11px;text-shadow:0 1px 6px #000;}
.fcard .fbar{display:flex;gap:5px;margin-bottom:8px;}
.fcard .fbar i{flex:1;height:5px;border-radius:2px;background:rgba(255,255,255,.10);transition:background .3s;}
.fcard .fbar i.on{background:var(--acc);box-shadow:0 0 6px var(--acc);}
.fcard .fmeta{font:500 11px/1.5 "JetBrains Mono";color:var(--ink2);margin-bottom:12px;text-shadow:0 1px 6px #000;}
.fcard .fdesc{font:400 12.5px/1.65 "JetBrains Mono";color:var(--ink2);text-shadow:0 1px 6px #000,0 0 3px #000;}

/* selected-vertex highlight (lives in the svg, tracks orbit) */
.hlg{opacity:0;transition:opacity .3s;}
.hlg.on{opacity:1;}
.hlwedge{fill:var(--acc);fill-opacity:.22;stroke:none;filter:blur(6px);}
.hlspoke{stroke:var(--acc);stroke-width:2;stroke-opacity:.75;}
.hldot{fill:var(--acc);filter:drop-shadow(0 0 5px var(--acc));}
.hovring{fill:var(--acc);filter:drop-shadow(0 0 11px var(--acc)) drop-shadow(0 0 3px #fff);pointer-events:none;opacity:0;animation:hovup .16s ease forwards;}
@keyframes hovup{from{opacity:0;}to{opacity:.95;}}
.lab.hi{fill:#fff;}
.disk.nolab .lab,.disk.nolab .stag,.disk.nolab .cap{opacity:0 !important;}

.backbtn{position:absolute;left:18px;top:18px;z-index:9;background:rgba(10,16,26,.7);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:9px 14px;font:600 11px/1 "JetBrains Mono";
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:.15s;opacity:0;pointer-events:none;}
.backbtn.show{opacity:1;pointer-events:auto;}
.backbtn:hover{border-color:var(--sel);}

.disk.gone{pointer-events:none;animation:disint .8s ease forwards;}
@keyframes disint{0%{opacity:1;}22%{opacity:.95;filter:brightness(2) blur(0);}100%{opacity:0;filter:brightness(.5) blur(20px);}}

/* overlay chrome */
.now{position:absolute;left:0;right:0;top:22px;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s;z-index:5;}
.now.show{opacity:1;}
.now .rn{font-family:"Orbitron";font-weight:700;font-size:clamp(18px,3vw,26px);letter-spacing:.04em;}
.now .rm{font-size:11px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase;margin-top:6px;}
.hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-size:10px;color:var(--faint);
  letter-spacing:.14em;text-transform:uppercase;z-index:5;pointer-events:none;}
.ctrls{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);display:flex;gap:10px;z-index:6;
  opacity:0;pointer-events:none;transition:opacity .4s;}
.ctrls.show{opacity:1;pointer-events:auto;}
.ctrls button{background:rgba(10,16,26,.7);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:9px 14px;font:600 11px/1 "JetBrains Mono";letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:.15s;}
.ctrls button:hover{border-color:var(--sel);}

/* category legend */
.legend{position:absolute;left:18px;bottom:18px;z-index:6;background:rgba(8,12,20,.55);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;backdrop-filter:blur(4px);max-width:210px;pointer-events:none;}
.legend .lt{font-family:"Orbitron";font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;}
.legend .lrow{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--dim);padding:2px 0;}
.legend .ls{width:11px;height:11px;border-radius:2px;flex:none;}
.legend .lnote{margin-top:8px;font-size:9px;color:var(--faint);letter-spacing:.04em;line-height:1.4;}

.menu::-webkit-scrollbar{width:8px;}.menu::-webkit-scrollbar-thumb{background:#1d2736;border-radius:4px;}

/* sound toggle */
.mutebtn{position:absolute;right:18px;top:18px;z-index:9;background:rgba(10,16,26,.7);color:var(--dim);
  border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:600 10px/1 "JetBrains Mono";
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:.15s;}
.mutebtn:hover{border-color:var(--sel);color:var(--ink);}
.mutebtn.off{color:var(--faint);}

/* one-shot load splash (pure-CSS fade so it can never get stuck) */
.loading{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 60% 30%,#0c1422,#05070d 70%);
  font:600 11px/1 "JetBrains Mono";letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
  animation:ldfade .5s ease .5s forwards;}
@keyframes ldfade{to{opacity:0;visibility:hidden;}}

/* responsive: shrink the fixed sidebar so the stage is usable on small screens
   (full hamburger collapse is a larger change, deferred) */
@media (max-width:760px){
  .app{grid-template-columns:188px 1fr;}
  .menu .ttl{font-size:12px;padding:4px 14px 12px;}
  .r{padding:7px 14px;font-size:11.5px;}
  .legend{max-width:170px;padding:8px 10px;}
}
@media (max-width:520px){
  .app{grid-template-columns:148px 1fr;}
  .scene{perspective:1600px;}
  .legend{display:none;}
  .now .rn{font-size:18px;}
  .mutebtn{padding:7px 9px;}
}
/* ===== role comparison ===== */
.cmpbar{display:flex;gap:8px;align-items:center;padding:2px 16px 12px;}
.cmptoggle{flex:1;background:rgba(10,16,26,.6);color:var(--dim);border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;font:700 10px/1 "Orbitron";letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:.15s;}
.cmptoggle:hover{color:var(--ink);border-color:var(--sel);}
.cmptoggle.on{color:var(--sel);border-color:var(--sel);background:rgba(54,217,138,.08);}
.cmpgo{background:var(--sel);color:#04140c;border:none;border-radius:8px;padding:7px 11px;font:700 10px/1 "Orbitron";
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:none;}
.cmpgo.show{display:block;}
.menu.cmp .r .rd{display:none;}
.r .chk{width:13px;height:13px;border:1px solid var(--faint);border-radius:3px;flex:none;display:none;}
.menu.cmp .r .chk{display:block;}
.r.sel .chk{background:var(--sel);border-color:var(--sel);box-shadow:0 0 7px var(--sel);}
.r.sel{color:var(--ink);border-left-color:var(--sel);}
.r.cdis{opacity:.3;pointer-events:none;}

.compare{position:absolute;inset:0;z-index:12;overflow:auto;padding:24px 30px 30px;
  background:radial-gradient(120% 90% at 60% 30%,#0c1422,#05070d 70%);opacity:0;pointer-events:none;transition:opacity .25s;}
.compare.show{opacity:1;pointer-events:auto;}
.cmptitle{font:700 13px/1 "Orbitron";letter-spacing:.08em;color:var(--ink);margin:0 0 3px 70px;}
.cmpsub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 14px 70px;}
.cmpsec{font:700 10px/1 "Orbitron";letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
  margin:22px 0 9px;border-bottom:1px solid var(--line);padding-bottom:8px;}
.cmpgrid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.cmpgrid>div{background:var(--pan);padding:7px 10px;display:flex;align-items:center;min-height:34px;}
.cmphdr{font:700 10px/1.25 "JetBrains Mono";letter-spacing:.03em;justify-content:center;text-align:center;cursor:pointer;color:var(--ink2);}
.cmphdr.g{color:var(--games);} .cmphdr.v{color:var(--film);}
.cmphdr.g:hover,.cmphdr.v:hover{text-decoration:underline;}
.cmphdr.lbl{justify-content:flex-start;color:var(--dim);font-family:"Orbitron";letter-spacing:.16em;text-transform:uppercase;cursor:default;}
.cmprow{font-size:11.5px;color:var(--ink2);gap:8px;cursor:default;}
.cmprow .cdot{width:9px;height:9px;border-radius:2px;flex:none;}
.cmprow.shared{background:rgba(54,217,138,.055);}
.cmpcell{justify-content:center;}
.cmpcell .v{display:block;border-radius:50%;}
.cmpcell.empty{color:var(--faint);}
.cmprow:hover,.cmpcell:hover{outline:1px solid rgba(54,217,138,.4);outline-offset:-1px;}
.cmpfoot{position:sticky;bottom:0;margin-top:16px;padding:11px 14px;background:rgba(8,12,20,.92);border:1px solid var(--line);
  border-radius:10px;font:400 12px/1.55 "JetBrains Mono";color:var(--ink2);min-height:40px;backdrop-filter:blur(4px);}
.cmpfoot .fn{color:var(--sel);font-weight:700;}
.cmpback{position:absolute;left:18px;top:18px;z-index:13;background:rgba(10,16,26,.7);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:9px 14px;font:600 11px/1 "JetBrains Mono";
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
.cmpback:hover{border-color:var(--sel);}

/* ===== v054 values-only comparison ===== */
.cmphead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:0 0 6px 70px;}
.cmphead .cmptitle{margin:0 0 3px 0;} .cmphead .cmpsub{margin:0;}
.cmptop{position:sticky;top:0;z-index:2;margin:0 0 16px;padding:12px 14px;background:rgba(8,12,20,.92);
  border:1px solid var(--line);border-radius:10px;font:400 12px/1.6 "JetBrains Mono";color:var(--ink2);
  min-height:40px;backdrop-filter:blur(4px);}
.cmptop .ohd{font:700 10px/1 "Orbitron";letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:9px;}
.cmptop .orow{display:flex;align-items:baseline;gap:8px;margin:3px 0;}
.cmptop .ok{font:700 9px/1.3 "Orbitron";letter-spacing:.1em;text-transform:uppercase;color:var(--faint);flex:none;width:78px;}
.cmptop .ov{color:var(--sel);font-weight:700;flex:none;}
.cmptop .ol{color:var(--ink2);}
.cmptop .none{color:var(--faint);}
.cmpov{margin-left:auto;color:var(--faint);font-size:10px;font-weight:700;letter-spacing:.02em;flex:none;}
.cmprow.shared .cmpov{color:var(--sel);}
.cmphdr .hf{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle;}
.cmphdr .hf.g{background:var(--games);} .cmphdr .hf.v{background:var(--film);}
@media (max-width:760px){ .cmphead{margin-left:64px;} .cmptitle,.cmpsub{margin-left:64px;} }
</style>
</head>
<body>
<div class="app">
  <nav class="menu" id="menu"><div class="ttl">Career Compass</div><div class="cmpbar"><button class="cmptoggle" id="cmpToggle">compare</button><button class="cmpgo" id="cmpGo">compare (0)</button></div></nav>
  <section class="stage" id="stage">
    <svg class="torus" id="torus"></svg>
    <div class="scene"><div class="world" id="world"></div></div>
    <div class="now" id="now"><div class="rn" id="nowName"></div><div class="rm" id="nowMeta"></div></div>
    <div class="ctrls" id="ctrls">
      <button id="prev">‹ prev</button><button id="all">⤢ all roles</button><button id="next">next ›</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="callout" id="callout"></div>
    <div class="fcard" id="fcard"></div>
    <button class="backbtn" id="back">‹ back to split</button>
    <button class="mutebtn" id="mute">sound: on</button>
    <div class="hint" id="hint">drag to spin · wheel to zoom · &larr;&rarr; select · enter to isolate</div>
    <div class="loading" id="loading">loading</div>
    <div class="compare" id="compare"><button class="cmpback" id="cmpBack">‹ back</button><div id="cmpBody"></div><div class="cmpfoot" id="cmpFoot"></div></div>
  </section>
</div>

<script>

/* ===== taxonomy ===== */
const SKILL_CATS={
 art:{l:"Art & Composition",c:"#ff8095"},
 mdl:{l:"Modeling & Sculpting",c:"#57c8a0"},
 srf:{l:"Surfacing",c:"#d2a8ff"},
 rig:{l:"Rigging & Animation",c:"#79c0ff"},
 fx:{l:"FX & Simulation",c:"#ff9d5c"},
 lrc:{l:"Lighting, Render & Comp",c:"#f2c14e"},
 tec:{l:"Technical & Pipeline",c:"#3fd6ff"},
};
const SW_CATS_G={
 eng:{l:"Engine",c:"#3fd6ff"},
 dcc:{l:"DCC",c:"#57c8a0"},
 scl:{l:"Sculpting",c:"#ff8095"},
 tex:{l:"Texturing",c:"#d2a8ff"},
 sim:{l:"Sim / Procedural",c:"#ff9d5c"},
 dsn:{l:"2D & Design",c:"#f2c14e"},
 scr:{l:"Scripting & VC",c:"#9aa6b2"},
};
const SW_CATS_V={
 dcc:{l:"DCC",c:"#57c8a0"},
 scl:{l:"Sculpting",c:"#ff8095"},
 tex:{l:"Texturing",c:"#d2a8ff"},
 sim:{l:"Sim",c:"#ff9d5c"},
 lgt:{l:"Lighting & Render",c:"#f2c14e"},
 cmp:{l:"Comp & Track",c:"#79c0ff"},
 pnt:{l:"2D & Paint",c:"#ff9ec4"},
 pip:{l:"Pipeline & Scripting",c:"#9aa6b2"},
};

/* abbreviation -> full name (used in detail cards); unmapped labels pass through */
const EXPAND={
 "Art fundamentals":"Art fundamentals","FX fundamentals":"FX fundamentals","CG fundamentals":"CG fundamentals",
 "Art fund.":"Art fundamentals","Colour/art fund.":"Colour & art fundamentals",
 "Subst. Designer":"Substance Designer","Subst. Painter":"Substance Painter",
 "Procedural tex.":"Procedural texturing","HS modeling":"Hard-surface modeling",
 "Topology/UV":"Topology & UV","UV/texel":"UV & texel density","UDIM/hero":"UDIM & hero assets",
 "Char design":"Character design","Anim principles":"Animation principles","Anim systems":"Animation systems",
 "Rigging aware":"Rigging awareness","Real-time light":"Real-time lighting","Real-time render":"Real-time rendering",
 "PBR render":"PBR rendering","Mocap":"Motion capture","Mocap cleanup":"Motion-capture cleanup",
 "Look-dev":"Look development","Lookdev integ.":"Look-dev integration","Lookdev pipeline":"Look-dev pipeline",
 "Physics feats":"Physics features","Physics sim":"Physics simulation","Houdini sim":"Houdini simulation",
 "Sim/rig FX":"Sim & rig FX","Timing/weight":"Timing & weight","Pipeline/cache":"Pipeline & caching",
 "Rough anim":"Rough animation","Live-action tr.":"Live-action tracking","Object/body tr.":"Object & body tracking",
 "Comp integ.":"Compositing integration","Rotoanim":"Roto-animation","Camera knowl.":"Camera knowledge",
 "Camera project.":"Camera projection","Detail/realism":"Detail & realism","Material knowl.":"Material knowledge",
 "Light/render bal.":"Light & render balance","Render knowl.":"Render knowledge","AOV mgmt":"AOV management",
 "Material/shader":"Material & shader","Facial anim":"Facial animation","Creature anim":"Creature animation",
 "Anatomy/physics":"Anatomy & physics","Pipeline arch.":"Pipeline architecture","Farm mgmt":"Render-farm management",
 "Resource alloc.":"Resource allocation","Pipeline underst.":"Pipeline understanding","Asset mgmt":"Asset management",
 "Paint/cleanup":"Paint & cleanup","Patience/deliv.":"Patience & delivery","Colour mgmt":"Colour management",
 "Colour/comp":"Colour & composition","Mood/story":"Mood & story","UI implement.":"UI implementation",
 "Cinematic lang.":"Cinematic language","Visual story":"Visual storytelling","Broad CG":"Broad CG knowledge",
 "Python dev":"Python development","Workflow/tools":"Workflow & tools","Scripting/tools":"Scripting & tools",
 "Industrial des.":"Industrial design","Perspective/light":"Perspective & light","Speed/adapt":"Speed & adaptability",
 "Blocking/staging":"Blocking & staging","Blender/Maya":"Blender / Maya","Maya/Blender":"Maya / Blender",
 "Maya/Hou/Nuke":"Maya / Houdini / Nuke","Substance":"Substance suite","DCC aware":"DCC awareness",
 "Renderer aware":"Renderer awareness",
};

const LOREM="Description coming soon.";
const READOUTS={"skills": {"2D elements": "Hand-made 2D textures, sprites and overlays (smoke, sparks, debris) used to dress or sell an effect. Often painted in Photoshop/After Effects and composited onto 3D simulations to add detail cheaply.", "2D/3D tracking": "Solving the motion of a real camera or object from footage so CG can be locked to the plate. Underpins matchmove and clean integration of effects into live action.", "2D/3D workflow": "Moving fluidly between painted 2D work and 3D scenes, projecting paintings onto geometry and back. Central to matte painting and environment finishing.", "3D animation": "Posing and timing 3D characters or cameras over a sequence to create believable motion. Built on the core animation principles of weight, spacing and staging.", "AOV mgmt": "Organising render passes (beauty, diffuse, specular, AO, cryptomatte and more) so compositors can rebuild and adjust the image. Clean AOV setups are what make a shot tweakable in comp.", "Accuracy": "Hitting exact positions, edges or tracks with no drift, frame after frame. Essential in roto, matchmove and any task where small errors break the illusion.", "Acting": "Giving a character intention, emotion and personality through performance, not just mechanical motion. The difference between a moving rig and a living character.", "Adaptability": "Switching tools, styles and tasks quickly as a production's needs change. Highly valued on small teams and fast pipelines.", "Anatomy": "Knowledge of muscle, bone and proportion so figures read as believable. Underlies sculpting, character art and convincing deformation.", "Anatomy/physics": "Combining anatomical structure with how flesh, muscle and cloth physically move. Key for rigs and creature work that deform realistically.", "Anim principles": "The classic fundamentals — timing, spacing, squash and stretch, anticipation, follow-through. The grammar every animator works in.", "Anim systems": "Building and wiring the state machines, blend trees and graphs that drive animation in an engine. Bridges authored clips and interactive gameplay.", "Art": "General visual fundamentals — form, value, colour and composition — applied across any discipline. The baseline literacy good work is built on.", "Art fundamentals": "Core skills of form, value, colour, perspective and composition. The foundation that separates competent CG from convincing imagery.", "Asset mgmt": "Tracking, versioning and organising the many files a shot or game needs. Keeps large teams from overwriting or losing work.", "Auto-rigging": "Building tools or templates that generate rigs automatically from a skeleton. Saves huge time when many characters share a structure.", "Blocking/staging": "Placing characters, props and cameras to read clearly and tell the story. The first pass that locks composition and staging before detail.", "Body mechanics": "Animating believable physical motion — walks, lifts, jumps — grounded in weight and balance. The technical backbone beneath performance.", "Brief to 3D": "Turning a written or visual brief into finished 3D work that matches intent. Requires interpreting reference and asking the right questions early.", "Broad CG": "A generalist's working knowledge across modelling, lookdev, lighting and comp. Lets one person carry a shot or fill gaps in a small team.", "CG fundamentals": "Understanding how 3D scenes, transforms, shading and rendering actually work under the hood. The base for any technical CG role.", "Camera blocking": "Setting camera placement, lensing and movement to frame the action. Defines how a sequence is read before animation refines it.", "Camera knowl.": "Understanding lenses, focal length, sensor size and how real cameras behave. Critical so CG cameras match the plate.", "Camera language": "Using shot size, angle and movement intentionally to convey meaning. The vocabulary of visual storytelling through the lens.", "Camera project.": "Projecting 2D paintings or photos onto 3D geometry from a camera to fake depth. A core matte-painting and set-extension trick.", "Camera work": "Designing and animating expressive camera moves that support the story. Spans framing, timing and lens choices.", "Char design": "Inventing characters with clear silhouette, personality and appeal. Balances visual storytelling with technical buildability.", "Cinematic lang.": "Knowing the conventions of film — coverage, continuity, pacing — to stage sequences that feel cinematic. Guides shot choices in cutscenes and trailers.", "Cinematography": "The craft of framing, lensing and lighting to compose moving images. Shapes mood and directs the viewer's eye.", "Collaboration": "Working smoothly across departments, sharing files and feedback without friction. The skill that keeps a pipeline moving.", "Colour mgmt": "Maintaining consistent colour across capture, work and delivery using colour spaces and LUTs (e.g. ACES). Prevents shots from shifting between stages.", "Colour theory": "Using hue, value and saturation relationships deliberately to guide the eye and set mood. Applies to concept, lighting and texturing alike.", "Colour/art fund.": "Combined colour theory and core art fundamentals applied to design work. Ensures pieces read well in value and palette.", "Colour/comp": "Balancing colour and composition together so an image reads clearly and feels intentional. Central to lighting and finishing.", "Communication": "Explaining ideas, giving and taking notes, and keeping stakeholders aligned. Often the deciding factor in senior and pipeline roles.", "Comp integ.": "Seamlessly blending CG elements into a live-action plate — matching grain, edges, light and grade. The final test of whether an effect is invisible.", "Complex FX": "Authoring advanced shader- or simulation-driven effects beyond standard particles. Demands both art sense and technical depth.", "Complex shots": "Handling shots with heavy overlap, occlusion or many moving parts. Requires planning, patience and clean technique.", "Compositing": "Layering rendered passes, plates and 2D elements into a final image. The stage where everything is balanced, graded and finished.", "Composition": "Arranging elements within the frame so the image reads clearly and leads the eye. A fundamental that underpins every visual discipline.", "Consistency": "Keeping look, scale and quality uniform across many assets or shots. What makes a body of work feel like one production.", "Continuity": "Ensuring lighting, props and action stay coherent across a sequence. Breaks in continuity pull the audience out of the story.", "Control design": "Designing intuitive rig controls so animators can pose efficiently. Good controls are invisible; bad ones slow a whole team.", "Creativity": "Generating fresh, fitting ideas and solving problems imaginatively. The engine behind concept and design work.", "Creature anim": "Animating non-human characters with believable, often invented locomotion. Blends study of real animals with imaginative performance.", "Cross-pipeline": "Understanding how data flows between departments and tools end to end. Lets a generalist or TD spot and fix bottlenecks.", "DCC APIs": "Programming against the scripting interfaces of tools like Maya, Houdini or Nuke. The basis of pipeline and TD tooling.", "Deformation": "How geometry bends and stretches when a rig moves — skinning, blendshapes, correctives. Determines whether a character looks solid or rubbery.", "Detail": "Adding the fine, believable touches — wear, grain, micro-surface — that sell realism. Often what separates student from pro work.", "Detail/realism": "Pushing surface and form detail until an asset reads as real. Demands strong reference discipline and patience.", "Digital painting": "Painting images digitally with full control of light, colour and texture. Core to concept art and matte painting.", "Drawing": "Foundational draughtsmanship — line, form, gesture and perspective. The bedrock skill of concept, storyboard and design.", "Editorial": "Cutting and timing shots together to build a sequence. Shapes pacing and informs previs and layout.", "Efficiency": "Working fast and lean without sacrificing quality, especially under deadline. Valued everywhere, essential in TD and pipeline roles.", "FX fundamentals": "Core principles of effects — forces, scale, timing, art-direction of chaos. The judgement that makes a sim look intentional.", "FX shaders": "Authoring shaders specifically for effects — fire, smoke, energy, dissolves. Bridges look-dev and real-time or offline FX.", "Facial anim": "Animating expression and lip-sync to convey emotion and dialogue. Among the most scrutinised areas of character work.", "Farm mgmt": "Running and monitoring the render farm — queues, priorities, failures. Keeps thousands of frames flowing to deadline.", "GUI building": "Creating artist-facing tool interfaces, typically in Qt/PySide. Makes pipeline tools usable by non-coders.", "Grain matching": "Matching film/sensor grain on CG or painted elements to the plate. A subtle but essential step for invisible integration.", "HS modeling": "Hard-surface modelling of mechanical, manufactured forms — weapons, vehicles, props. Prizes clean topology and crisp edges.", "High-res sculpt": "Sculpting fine, high-resolution detail (typically in ZBrush) for baking or hero assets. Where surface realism is born.", "Houdini sim": "Setting up and art-directing simulations in Houdini — fluids, pyro, RBD, cloth. The dominant toolset for film-grade FX.", "Industrial des.": "Designing believable manufactured objects with real-world logic and function. Grounds hard-surface concept and modelling.", "Integration": "Making CG sit convincingly inside a real or rendered scene across light, edge and grade. The hallmark of finished VFX.", "Iteration": "Refining work rapidly through many feedback passes. The everyday loop of production art.", "Keyframe": "Setting key poses by hand and controlling the in-betweens. The core technique of character animation.", "Keying": "Pulling clean mattes from green/blue screen footage. A daily compositing task that demands precision on edges and spill.", "Light/render bal.": "Balancing lighting choices against render cost and noise. Keeps shots both beautiful and affordable to render.", "Lighting": "Placing and shaping lights to define form, mood and focus. Drives the emotional read and realism of an image.", "Live-action tr.": "Tracking live-action footage so CG can be matched to it. The foundation of matchmove and integration.", "Look-dev": "Developing how an asset looks under light — shaders, textures, response. Locks the final material appearance before lighting.", "Lookdev integ.": "Ensuring look-dev choices hold up once assets reach lighting and comp. Closes the gap between isolated turntables and real shots.", "Lookdev pipeline": "The tools and standards that move shading and textures cleanly through a studio. Keeps look consistent across many assets.", "Matchmoving": "Reconstructing camera and object motion from footage for CG to inherit. The precise first step of most VFX shots.", "Material authoring": "Building reusable, physically-based materials from scratch. Defines how surfaces respond to light across a project.", "Material knowl.": "Understanding how real materials reflect, scatter and wear. Informs believable shading and texturing decisions.", "Material/shader": "Authoring materials and the shaders that drive them. Where surface look and render behaviour are defined.", "Mocap": "Working with motion-capture data to drive animation. Speeds realistic motion but needs skilled cleanup and retargeting.", "Mocap cleanup": "Fixing noise, foot-sliding and pops in captured data. Turns raw mocap into usable, polished animation.", "Modeling": "Building 3D geometry with clean, purposeful topology. The foundation asset every other department builds on.", "Mood/story": "Using image-making to evoke feeling and serve narrative. Lighting and concept live or die on this.", "Motion design": "Animating graphic elements, type and UI with timing and polish. Common in titles, interfaces and trailers.", "Motion eye": "An instinct for whether motion looks right — weight, speed, believability. The judgement that guides animation and FX.", "Multi-platform": "Designing assets and UI that work across consoles, PC and mobile. Demands awareness of varied resolutions and constraints.", "Multi-tasking": "Juggling many simultaneous tasks and shots without dropping quality. Routine in wrangling and production support.", "Object/body tr.": "Tracking specific objects or body parts in a plate, not just the camera. Feeds matchmove, roto and effects placement.", "On-set capture": "Gathering reference, HDRIs and measurements during the shoot. The data lighting and lookdev rely on for accuracy.", "Optimization": "Making assets and scenes run fast within a performance budget — polycount, draw calls, memory. Critical wherever real-time or render cost matters.", "Organisation": "Keeping files, naming and tasks tidy and findable. Unglamorous but vital to a smooth pipeline.", "PBR render": "Rendering with physically-based materials and lighting for predictable, realistic results. The modern standard across film and games.", "PBR shading": "Authoring shaders on physically-based principles so surfaces respond correctly to any lighting. The default shading model today.", "PBR texturing": "Painting texture maps (albedo, roughness, metal, normal) to the PBR standard. Ensures materials read correctly under any light.", "Pacing": "Controlling the rhythm and timing of a sequence. Shapes tension, clarity and audience engagement.", "Paint/cleanup": "Removing rigs, markers and unwanted elements from plates frame by frame. Painstaking but essential prep work.", "Particle/VFX": "Creating real-time or rendered particle effects — sparks, smoke, magic. Blends art direction with technical setup.", "Patience/deliv.": "Sustaining careful, accurate work over long repetitive tasks and delivering on time. The temperament roto and paint demand.", "Perspective/light": "Constructing correct perspective and convincing light in painted work. Foundational to matte painting and concept.", "Photogrammetry": "Building 3D assets and textures from photographs of real objects. A fast route to high realism.", "Photography": "Understanding exposure, lensing and composition through the camera. Informs lighting, matte painting and reference capture.", "Photorealism": "Achieving imagery indistinguishable from a photograph. The benchmark for high-end VFX integration.", "Physics feats": "Implementing physics-driven behaviours (cloth, ragdoll, secondary motion) in engine or rig. Adds believable reactive movement.", "Physics sim": "Simulating physical phenomena — cloth, fluids, rigid bodies, muscle. The core of creature and effects work.", "Pipeline": "The connected tools and steps that carry work through production. Smooth pipelines are what let big shows ship.", "Pipeline arch.": "Designing the overall structure and data flow of a studio's pipeline. A senior, systems-level responsibility.", "Pipeline underst.": "Knowing how the pipeline behaves so you can work within and troubleshoot it. Expected of wranglers and TDs.", "Pipeline/cache": "Managing simulation caches and how heavy data moves between steps. Keeps FX and creature work performant and shareable.", "Plausibility": "Designing things that feel believable within their world, even if invented. Grounds concept and creature design.", "Problem-solving": "Diagnosing issues and finding practical fixes under pressure. The defining trait of technical and TD roles.", "Procedural": "Building results from rules and parameters rather than by hand. Enables scalable, art-directable assets and effects.", "Procedural tex.": "Generating textures procedurally (e.g. in Substance Designer) for resolution-independent, tweakable surfaces. A staple of modern material work.", "Programming": "Writing reliable code to build tools and automation. The core competency of pipeline and software-leaning roles.", "Prototyping": "Quickly building rough working versions to test ideas. Speeds design decisions in UI and gameplay.", "Python dev": "Developing tools and automation in Python across DCCs and the pipeline. The lingua franca of studio TDs.", "Real-time light": "Lighting within an engine's real-time constraints — baked and dynamic. Demands a balance of beauty and performance.", "Real-time render": "Producing final imagery at interactive frame rates. The defining constraint of games and virtual production.", "Reference": "Gathering and using accurate visual reference to ground work. The discipline that keeps art honest.", "Render knowl.": "Understanding renderers, sampling, AOVs and noise to get clean results efficiently. Core to lighting and lookdev.", "Resource alloc.": "Distributing machines, licences and time across competing jobs. A wrangler's balancing act.", "Retopology": "Rebuilding clean, efficient topology over a high-res sculpt. Makes dense sculpts usable for animation and games.", "Rigging": "Building the skeletons and controls that make a model posable. The technical bridge between modelling and animation.", "Rigging aware": "Modelling and sculpting with how the asset will deform in mind. Prevents costly topology fixes later.", "Rotoanim": "Animating mattes that track moving subjects over time. Bridges roto and matchmove for complex shots.", "Rotoscoping": "Hand-drawing mattes to isolate elements frame by frame. The unglamorous backbone of clean comps.", "Rough anim": "Fast, loose animation passes that establish motion and timing. Used heavily in previs and blocking.", "Scripting": "Writing small scripts to automate repetitive tasks. A force-multiplier across nearly every CG role.", "Scripting/tools": "Building scripts and tools to extend software and speed work. Where art and engineering meet for TDs.", "Sculpting": "Shaping organic form and detail in 3D, usually in ZBrush. The heart of character and creature modelling.", "Sequencing": "Assembling shots and events into a coherent timed sequence. Central to cinematics and editorial.", "Shader authoring": "Writing shaders that define how surfaces render. Demands both visual judgement and technical math.", "Shader basics": "A working grasp of how shaders and materials are built. Enough to author and troubleshoot common looks.", "Shaders": "Programs that compute how surfaces respond to light. The control layer over every rendered material.", "Sim numerics": "Understanding the math and solver behaviour behind simulations. Lets a TD tune stable, art-directable results.", "Sim/rig FX": "Driving effects through rigs and simulation together — muscle, cloth, secondary motion. Common in creature FX.", "Simulation": "Computing physically-based motion of fluids, cloth, particles and more. The engine of effects and creature work.", "Skinning": "Binding geometry to a skeleton so it deforms cleanly. A make-or-break step for believable characters.", "Speed/adapt": "Working quickly and adjusting to shifting direction. Prized in storyboard and fast-turnaround work.", "Staging": "Arranging the scene so the key action reads instantly. A core animation and layout principle.", "Storytelling": "Conveying narrative and emotion through visual choices. The throughline behind concept, layout and animation.", "Surface realism": "Achieving believable micro-detail, wear and material response on surfaces. The texturing artist's primary goal.", "Texturing": "Creating the colour and surface-property maps that dress a model. Defines how an asset looks and feels.", "Timing/weight": "Tuning the timing and apparent mass of motion so it feels grounded. The soul of good animation and FX.", "Topology/UV": "Building clean edge flow and laying out UVs efficiently. Determines how well a model deforms and textures.", "Tracking": "Solving motion in footage so elements stay locked. Underpins matchmove, roto and integration.", rd in many film pipelines.", "Keyshot": "Fast, easy real-time renderer for product-style visualisation. Handy for quick concept renders.", "Krita": "Free, open-source digital painting application. A capable Photoshop alternative for illustration.", "Linux": "The operating system most studios run for rendering and pipeline. Comfort on the command line is expected of TDs.", "Mari": "High-end 3D paint tool built for film-quality, multi-UDIM texturing. The texture artist's workhorse for hero assets.", "Marmoset": "Real-time renderer and baker (Toolbag) used for portfolio shots and texture baking. Popular for showcasing game assets.", "Marvelous": "Marvelous Designer — cloth pattern and simulation software. The standard for creating realistic garments.", "Maya": "Autodesk's 3D suite and the studio standard for animation, rigging and modelling. The most widely required package in film and games.", "Maya/Blender": "The two leading general 3D packages; proficiency in either is the baseline. Maya dominates studios, Blender is fast-growing.", "Maya/Hou/Nuke": "The film trinity — Maya for assets/animation, Houdini for FX, Nuke for comp. Broad familiarity marks an experienced generalist or TD.", "Megascans": "Quixel's library of scanned, photoreal assets and materials. A fast source of realistic environment detail.", "Mocha": "Planar tracking and roto software, often used inside other comp tools. Excellent for tracking flat surfaces.", "MotionBuilder": "Autodesk's real-time character animation tool, strong with motion capture. Common for cleaning and retargeting mocap.", "Mudbox": "Autodesk's digital sculpting and texture-painting tool. A simpler alternative to ZBrush.", "Nuke": "Foundry's node-based compositor and the film-industry standard. Where shots are assembled and finished.", "OSL": "Open Shading Language, used to write physically-based shaders for renderers like Arnold. A look-dev/shading-TD tool.", "PDG/USD": "Houdini's PDG for procedural task graphs and USD for scene interchange. Modern building blocks of scalable pipelines.", "PFTrack": "Camera and object tracking software for matchmove. One of the main tools alongside 3DEqualizer.", "Perforce": "Version control built for large binary game assets. The studio standard for managing big game projects.", "Photoshop": "Adobe's image-editing and painting tool, used everywhere from concept to texture touch-up. The most universal 2D application.", "Premiere": "Adobe's video editing software. Used for editorial, previs cuts and reference assembly.", "Procreate": "iPad painting app popular for concept and illustration sketching. Valued for its natural, portable drawing.", "PureRef": "A lightweight tool for arranging reference images on a single board. A staple of every artist's setup.", "Python": "The dominant scripting language across DCCs and pipelines. The go-to for tools, automation and TD work.", "Python/MEL": "Python and Maya's MEL scripting languages for automating and customising Maya. Core to rigging and Maya tooling.", "Qt/PySide": "The framework for building artist tool interfaces in Python. How most studio tools get their GUIs.", "Qualoth": "A cloth-simulation plugin for Maya. Used for realistic garment and fabric dynamics.", "Qube": "A render-farm management and queuing system. Schedules and monitors distributed rendering.", "Quixel": "Quixel Suite/Megascans — scanned assets, materials and the Mixer tool. A fast pipeline to photoreal surfaces.", "Renderer": "The engine that turns a 3D scene into final images (e.g. Arnold, RenderMan, Karma, V-Ray). Fluency in at least one is expected for lighting and lookdev.", "Renderer aware": "Working knowledge of how production renderers behave — settings, AOVs, performance. Enough to support lighting and farm work.", "Resolve": "DaVinci Resolve — editing, colour grading and finishing software. Common for grade and conform.", "ShotGrid": "Production tracking and review software (formerly Shotgun). The hub for tasks, versions and notes in     if(vfocus && sl!==vfocus.sl) return;
    u.querySelectorAll(".disk circle[data-i]:not(.pt)").forEach(c=>{
      const r=c.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2, d=Math.hypot(cx-x,cy-y);
      if(d<bd){ bd=d; best={sl,k:+c.dataset.i}; }
    });
  });
  return best;
}
let hov=null;
function setHover(hit){
  const key=hit?hit.sl+":"+hit.k:null, cur=hov?hov.sl+":"+hov.k:null;
  if(key===cur) return;
  units.forEach(u=>u.querySelectorAll(".hovring").forEach(e=>e.remove()));
  hov=hit;
  if(!hit || iso===null) return;
  if(vfocus && vfocus.sl===hit.sl && vfocus.k===hit.k) return;
  const mu=units[iso*2+hit.sl], disk=mu&&mu._disk, svg=disk&&disk.querySelector("svg");
  const base=svg&&svg.querySelector(`circle[data-i="${hit.k}"]:not(.pt)`);
  if(!base) return;
  const ring=document.createElementNS("http://www.w3.org/2000/svg","circle");
  ring.setAttribute("class","hovring");
  ring.setAttribute("cx",base.getAttribute("cx")); ring.setAttribute("cy",base.getAttribute("cy"));
  ring.setAttribute("r",(parseFloat(base.getAttribute("r"))+3).toFixed(1));
  ring.style.setProperty("--acc",base.getAttribute("fill"));
  svg.appendChild(ring);
  hoverBeep(hit.k);
}
function focusVertex(role,sl,k){
  if(iso!==role) return;
  const r=ROLES[role], arr=sl?r.sw:r.sk, it=arr[k];
  clickBeep(it[2]);
  const set=sl?(r.f==="g"?SW_CATS_G:SW_CATS_V):SKILL_CATS, cat=set[it[1]]||{l:"",c:"#8895a3"};
  undecorate();
  vfocus={role,sl,k,side: sl===0?"right":"left", gx: sl===0?VF_X:-VF_X};
  followUntil=performance.now()+680;
  /* snap the focused role's two disks straight to their focus transform (no slide), so the
     card can measure the FINAL graph bounding box on the very first frame. Without this the
     first click reads a mid-transition box and the card lands inside the graph; the second
     click works only because the disk is already settled. Re-enable transitions next frame
     so exit/return still animates. */
  const _da=units[role*2]._disk, _db=units[role*2+1]._disk;
  _da.classList.add("snap"); _db.classList.add("snap");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ _da.classList.remove("snap"); _db.classList.remove("snap"); }));
  layout(); decorate();
  setCard(`<div class="ft">${sl?"Software":"Skill"} \u00b7 ${r.n}</div>`+
    `<div class="fbar">${[1,2,3,4,5].map(n=>`<i class="${n<=it[2]?'on':''}"></i>`).join("")}</div>`+
    `<div class="fmeta">importance ${it[2]}/5 \u00b7 ${cat.l}</div>`+
    `<div class="fdesc">${(READOUTS[sl?"software":"skills"][it[0]]||LOREM)}</div>`, cat.c);
  document.getElementById("back").classList.add("show");
  document.getElementById("legend").style.display="none";
  document.getElementById("nowMeta").textContent=(r.f==="g"?"Games":"Film")+" \u00b7 "+(sl?"software":"skills")+" detail";
  document.getElementById("hint").textContent="tap another point to compare \u00b7 back / esc to return \u00b7 drag to orbit";
}
function exitVertex(){
  if(!vfocus) return;
  backBeep();
  undecorate(); vfocus=null; layout();
  if(iso!==null){ const r=ROLES[iso]; document.getElementById("nowMeta").textContent=(r.f==="g"?"Games":"Film")+" \u00b7 skills (left) + software (right)"; }
  document.getElementById("fcard").classList.remove("show");
  document.getElementById("fcard").style.top=""; document.getElementById("fcard").style.transform="";
  document.getElementById("fcard").style.left=""; document.getElementById("fcard").style.right="";
  document.getElementById("legend").style.display="";
  document.getElementById("back").classList.remove("show");
  document.getElementById("hint").textContent="tap a skill or software point to expand it \u00b7 drag to orbit (\u00b120\u00b0) \u00b7 prev / next";
}

function frame(){
  rafId=null;
  const following = !!vfocus && performance.now()<followUntil;
  if(dirty||following){
  dirty=false;
  if(iso===null){
    for(let i=0;i<units.length;i++){
      if(preview!==null && SLICES[i].ri===preview){ units[i].style.opacity="1"; continue; }
      const f=(Math.cos((i*STEP+ry)*Math.PI/180)+1)/2;
      units[i].style.opacity = f>=0.5 ? "1" : (0.18+f*0.9).toFixed(2);
    }
  }
  if(preview!==null && iso===null){
    const ui=skUnit(preview), u=units[ui];
    u.style.transform=unitTf(ui);
    const co=document.getElementById("callout"), lead=co.querySelector(".lead");
    if(!co._cache||co._cache.preview!==preview||co._cache.ver!==camVer){
      const d=u._disk.getBoundingClientRect(), sr=stage.getBoundingClientRect();
      const cx=d.left+d.width/2-sr.left, cy=d.top-sr.top-14;
      co.style.left=cx+"px"; co.style.top=cy+"px";
      const tx=d.left+d.width/2-sr.left, ty=d.top+d.height/2-sr.top, ax=cx, ay=cy+18;
      const ang=Math.atan2(ty-ay,tx-ax)*180/Math.PI, len=Math.min(240,Math.hypot(tx-ax,ty-ay));
      lead.style.width=len+"px"; lead.style.transform=`rotate(${ang.toFixed(1)}deg)`;
      co._cache={preview,ver:camVer};
    }
  }
  if(vfocus){
    const fc=document.getElementById("fcard");
    if(following||!fc._cache||fc._cache.vfocus!==vfocus||fc._cache.ver!==camVer){
      const disk=units[vfocus.role*2+vfocus.sl]._disk;
      const sr=stage.getBoundingClientRect(), right=vfocus.side==="right";
      let gR=-1e9, gL=1e9; const dr=disk.getBoundingClientRect(); gR=Math.max(gR,dr.right); gL=Math.min(gL,dr.left);
      disk.querySelectorAll("text.lab,text.stag").forEach(t=>{const r=t.getBoundingClientRect(); if(r.width){gR=Math.max(gR,r.right); gL=Math.min(gL,r.left);}});
      gR-=sr.left; gL-=sr.left;
      const cy=dr.top+dr.height/2-sr.top;
      const cardW=300; let cardH=fc.getBoundingClientRect().height; if(!(cardH>120)) cardH=255;
      let cardX = right ? (gR+30) : (gL-30-cardW);
      cardX = Math.max(8, Math.min(sr.width-cardW-8, cardX));
      let cardTop = Math.max(8, Math.min(sr.height-cardH-8, cy-cardH/2));
      fc.style.left=cardX+"px"; fc.style.right="auto"; fc.style.transform="none"; fc.style.top=cardTop+"px";
      fc._cache={vfocus,ver:camVer};
    }
  }
  }
  if(following) scheduleFrame();
}

const stage=document.getElementById("stage");
const pointers=new Map();
let lastX=0,lastY=0,downX=0,downY=0,pinchD=0,downIso=null;
stage.addEventListener("pointerenter",()=>hovering=true);
stage.addEventListener("pointerleave",()=>{hovering=false; setHover(null);});
stage.addEventListener("pointerdown",e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  dragMoved=false; lastX=e.clientX; lastY=e.clientY; downX=e.clientX; downY=e.clientY; downIso=iso;
  if(pointers.size===2){const p=[...pointers.values()];pinchD=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}
});
stage.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId)){
    if(e.pointerType==="touch" || dragging || iso===null){ if(hov) setHover(null); return; }
    setHover(nearestVertex(e.clientX,e.clientY)); return;
  }
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(pinchD)zoomZ=Math.max(-520,Math.min(260,zoomZ+(d-pinchD)));
    pinchD=d; dragMoved=true; dragging=true; applyWorld(); return;
  }
  if(!dragging){
    if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)<=10) return;
    dragging=true; dragMoved=true; stage.classList.add("drag");
    try{stage.setPointerCapture(e.pointerId);}catch(_){}
    clearTimeout(previewTimer); setPreview(null);
    lastX=e.clientX; lastY=e.clientY;
  }
  const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
  ry+=dx*0.3;
  if(iso!==null){ ry=Math.max(-20,Math.min(20,ry)); }
  applyWorld();
});
function endPtr(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2)pinchD=0;
  if(pointers.size===0){dragging=false;stage.classList.remove("drag");}
}
stage.addEventListener("pointerup",endPtr);
stage.addEventListener("pointercancel",endPtr);
stage.addEventListener("pointerup",e=>{
  if(dragMoved || downIso===null) return;
  const hit=nearestVertex(e.clientX,e.clientY);
  if(hit){ focusVertex(iso,hit.sl,hit.k); return; }
  if(vfocus && !(e.target.closest && e.target.closest("#fcard,#back"))) exitVertex();
});
document.getElementById("back").addEventListener("click",exitVertex);
let wheelT=0;
stage.addEventListener("wheel",e=>{e.preventDefault();const now=performance.now();if(now-wheelT<16)return;wheelT=now;zoomZ=Math.max(-520,Math.min(260,zoomZ-e.deltaY*0.5));applyWorld();},{passive:false});

document.getElementById("prev").addEventListener("click",()=>{ if(iso!==null) isolate(Math.max(0,iso-1)); });
document.getElementById("next").addEventListener("click",()=>{ if(iso!==null) isolate(Math.min(lastRole,iso+1)); });
document.getElementById("all").addEventListener("click",rebuild);
function nearestAngle(t,c){while(t-c>180)t-=360;while(t-c<-180)t+=360;return t;}
function frontIdx(){let b=0,bv=-2;for(let i=0;i<units.length;i++){const f=Math.cos((i*STEP+ry)*Math.PI/180);if(f>bv){bv=f;b=i;}}return SLICES[b].ri;}
function selectFront(role){const N=ROLES.length;selIdx=((role%N)+N)%N;ry=norm(ry);tweenCam(rx,nearestAngle(-skUnit(selIdx)*STEP,ry),420);requestPreview(selIdx);}

document.addEventListener("keydown",e=>{
  if(e.repeat&&/[A-Za-z ]|Arrow/.test(e.key)) return;
  if(compareEl.classList.contains("show")){ if(e.key==="Escape") closeCompare(); return; }
  if(e.key==="Escape"){ if(vfocus) exitVertex(); else if(iso!==null) rebuild(); else { selIdx=null; clearTimeout(previewTimer); setPreview(null); } }
  else if(e.key==="ArrowRight"){ iso!==null?isolate(Math.min(lastRole,iso+1)):selectFront((selIdx==null?frontIdx():selIdx)+1); }
  else if(e.key==="ArrowLeft"){ iso!==null?isolate(Math.max(0,iso-1)):selectFront((selIdx==null?frontIdx():selIdx)-1); }
  else if(e.key==="Enter"||e.key===" "){ if(iso===null&&selIdx!=null){ e.preventDefault(); isolate(selIdx); } }
});

function placeLabels(){
  const need=R+22;
  document.querySelectorAll(".disk svg").forEach(svg=>{
    svg.querySelectorAll("text.lab").forEach(t=>{
      let x=parseFloat(t.getAttribute("x")), y=parseFloat(t.getAttribute("y"));
      const len=Math.hypot(x,y)||1, ux=x/len, uy=y/len;
      for(let iter=0;iter<5;iter++){
        let bb; try{ bb=t.getBBox(); }catch(e){ return; }
        const nx=Math.max(bb.x,Math.min(0,bb.x+bb.width)), ny=Math.max(bb.y,Math.min(0,bb.y+bb.height));
        const nd=Math.hypot(nx,ny);
        if(nd>=need) break;
        const push=need-nd+0.5; x+=ux*push; y+=uy*push;
        t.setAttribute("x",x.toFixed(1)); t.setAttribute("y",y.toFixed(1));
      }
    });
  });
}

renderLegend(null);
initTorus();
applyWorld(); layout(); drawTorus(); 
window.addEventListener("resize",()=>{ camVer++; stageRect=null; torusRectsCached=false; document.getElementById("callout")._cache=null; document.getElementById("fcard")._cache=null; drawTorus(); mark(); });
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(placeLabels);}else{placeLabels();}

</script>
